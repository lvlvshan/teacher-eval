<style>
:root{
  --bg:#f4f6fa; --card:#fff; --line:#e2e8f0; --text:#1e293b; --muted:#64748b;
  --brand:#2563eb; --brand-dark:#1d4ed8; --ok:#15803d; --okbg:#ecfdf5;
  --err:#b91c1c; --errbg:#fef2f2; --warn:#b45309; --warnbg:#fffbeb;
  --radius:10px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font:14px/1.65 -apple-system,"Segoe UI","Microsoft YaHei",system-ui,sans-serif}
a{color:var(--brand);text-decoration:none}
a:hover{text-decoration:underline}
h1,h2,h3{margin:0 0 12px;font-weight:600;line-height:1.35}
h1{font-size:22px}
h2{font-size:17px}
h3{font-size:15px}
p{margin:0 0 10px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{background:#f8fafc;font-weight:600;color:#475569;white-space:nowrap}
tbody tr:hover{background:#fafcff}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:18px 20px;margin-bottom:16px;box-shadow:0 1px 2px rgba(15,23,42,.04)}
.row{display:flex;gap:16px;flex-wrap:wrap}
.col{flex:1;min-width:260px}
.muted{color:var(--muted)}
.small{font-size:12px}
.right{text-align:right}
.center{text-align:center}
.mt{margin-top:14px}
.mb{margin-bottom:14px}
.hide{display:none}

/* 表单 */
label.field{display:block;margin-bottom:12px;font-size:13px;color:#475569}
label.field > span{display:block;margin-bottom:5px;font-weight:500}
input[type=text],input[type=password],input[type=number],input[type=date],
input[type=datetime-local],input[type=search],select,textarea{
  width:100%;padding:8px 10px;border:1px solid #cbd5e1;border-radius:8px;
  font:inherit;font-size:13px;background:#fff;color:var(--text);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
textarea{min-height:90px;resize:vertical}
.inline{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.inline > *{flex:0 0 auto}
.inline > .grow{flex:1;min-width:160px}

/* 按钮 */
.btn{display:inline-block;padding:8px 15px;border:1px solid #cbd5e1;border-radius:8px;
  background:#fff;color:#334155;font:inherit;font-size:13px;cursor:pointer;
  line-height:1.4;text-decoration:none;transition:.15s}
.btn:hover{background:#f1f5f9;text-decoration:none}
.btn-primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn-primary:hover{background:var(--brand-dark)}
.btn-danger{color:var(--err);border-color:#fecaca}
.btn-danger:hover{background:var(--errbg)}
.btn-sm{padding:4px 10px;font-size:12px}
.btn[disabled]{opacity:.5;cursor:not-allowed}

/* 标签 */
.tag{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;
  background:#eef2f7;color:#475569;white-space:nowrap}
.tag-ok{background:var(--okbg);color:var(--ok)}
.tag-err{background:var(--errbg);color:var(--err)}
.tag-warn{background:var(--warnbg);color:var(--warn)}
.tag-info{background:#eff6ff;color:#1d4ed8}

/* 提示 */
.flash{padding:10px 14px;border-radius:8px;margin-bottom:14px;font-size:13px;border:1px solid}
.flash-ok{background:var(--okbg);border-color:#bbf7d0;color:var(--ok)}
.flash-err{background:var(--errbg);border-color:#fecaca;color:var(--err)}

/* 后台框架 */
.topbar{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.topbar-in{max-width:1280px;margin:0 auto;padding:0 18px;display:flex;align-items:center;gap:22px;height:56px}
.brand{font-weight:700;font-size:15px;color:#0f172a;white-space:nowrap}
.brand em{color:var(--brand);font-style:normal}
.nav{display:flex;gap:2px;flex-wrap:wrap;flex:1}
.nav a{padding:6px 11px;border-radius:8px;color:#475569;font-size:13px}
.nav a:hover{background:#f1f5f9;text-decoration:none}
.nav a.on{background:#eff6ff;color:var(--brand);font-weight:600}
.wrap{max-width:1280px;margin:0 auto;padding:20px 18px 60px}
.pagehead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}

/* 统计块 */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.stat b{display:block;font-size:24px;font-weight:700;line-height:1.2}
.stat span{font-size:12px;color:var(--muted)}

/* 进度条 */
.bar{height:6px;background:#eef2f7;border-radius:999px;overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--brand);border-radius:999px}

/* 表格容器 */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:#fff}
.tablewrap table{border-bottom:none}
.tablewrap th:first-child,.tablewrap td:first-child{padding-left:14px}

@media (max-width:720px){
  .topbar-in{height:auto;flex-wrap:wrap;padding:10px 12px;gap:8px}
  .wrap{padding:14px 12px 40px}
  .col{min-width:100%}
}
</style>
